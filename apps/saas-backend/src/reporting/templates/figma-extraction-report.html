  <style>
    :root {
      /* Palette: Zinc (Dark Mode) */
      --color-zinc-50: #fafafa;
      --color-zinc-100: #f4f4f5;
      --color-zinc-200: #e4e4e7;
      --color-zinc-300: #d4d4d8;
      --color-zinc-400: #a1a1aa;
      --color-zinc-500: #71717a;
      --color-zinc-600: #52525b;
      --color-zinc-700: #3f3f46;
      --color-zinc-800: #27272a;
      --color-zinc-900: #18181b;
      --color-zinc-950: #09090b;

      /* Palette: Indigo */
      --color-indigo-400: #818cf8;
      --color-indigo-500: #6366f1;
      --color-indigo-600: #4f46e5;

      /* Semantic Tokens */
      --bg-page: var(--color-zinc-950);
      --bg-card: rgba(24, 24, 27, 0.6);
      --bg-card-hover: rgba(39, 39, 42, 0.7);

      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-default: rgba(255, 255, 255, 0.15);

      --text-main: var(--color-zinc-50);
      --text-muted: var(--color-zinc-400);

      --accent: var(--color-indigo-500);
      --accent-glow: rgba(99, 102, 241, 0.4);

      /* Typography */
      --font-ui: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 4rem;
    }

    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.07), transparent 40%),
        radial-gradient(circle at 80% 10%, rgba(34, 197, 94, 0.03), transparent 30%);
      z-index: -1;
      pointer-events: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* Header */
    header {
      margin-top: 4rem;
      margin-bottom: 3rem;
      padding: 3rem;
      background: linear-gradient(180deg, rgba(39, 39, 42, 0.2) 0%, rgba(24, 24, 27, 0.2) 100%);
      border: 1px solid var(--border-default);
      background-color: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #fff, #a1a1aa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .metadata-item strong {
      color: var(--text-main);
      margin-right: 0.5rem;
    }

    /* Summary Cards */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .summary-card {
      padding: 1.5rem;
      background: rgba(39, 39, 42, 0.4);
      border: 1px solid var(--border-subtle);
      border-radius: 0.75rem;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .summary-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-default);
      transform: translateY(-2px);
    }

    .summary-card h3 {
      font-size: 0.825rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .summary-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
      font-feature-settings: "tnum";
    }

    /* Sections */
    .section {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 1rem;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .section-header {
      padding: 1.5rem 2rem;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-subtle);
    }

    .section-header h3 {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .section-content {
      padding: 2rem;
    }

    /* Component List */
    .component-list {
      display: grid;
      gap: 1rem;
    }

    .component-item {
      padding: 1.25rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 0.5rem;
      transition: background 0.2s;
    }

    .component-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .component-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .component-name {
      font-weight: 600;
      color: var(--text-main);
      font-size: 1rem;
    }

    .component-type {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      padding: 0.2rem 0.6rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .component-details {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* Design Tokens */
    .design-tokens {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .token-group {
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 0.5rem;
    }

    .token-group h4 {
      margin-bottom: 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .token-values {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .token-tag {
      background: rgba(255, 255, 255, 0.05);
      color: var(--color-zinc-300);
      padding: 0.25rem 0.6rem;
      border-radius: 0.25rem;
      font-size: 0.8rem;
      border: 1px solid var(--border-subtle);
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      border-top: 1px solid var(--border-subtle);
      padding-top: 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>{{title}}</h1>
      <div class="metadata">
        <div class="metadata-item">
          <strong>Figma File:</strong> {{figmaFileName}}
        </div>
        <div class="metadata-item">
          <strong>Extracted:</strong> {{timestamp}}
        </div>
      </div>
    </header>

    <div class="summary">
      <div class="summary-card">
        <h3>Total Components</h3>
        <div class="summary-value">{{totalComponents}}</div>
      </div>

      <div class="summary-card">
        <h3>Design Tokens</h3>
        <div class="summary-value">{{designTokenCount}}</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h3>Components</h3>
      </div>
      <div class="section-content">
        <div class="component-list">
          {{componentList}}
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h3>Design Tokens</h3>
      </div>
      <div class="section-content">
        <div class="design-tokens">
          {{designTokens}}
        </div>
      </div>
    </div>

    <footer>
      <p>Generated by DesignQA - Figma Extraction</p>
    </footer>
  </div>
</body>

</html>
