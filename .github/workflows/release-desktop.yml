name: Build Desktop Apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build (e.g., v2.0.1)'
        required: true
        type: string

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
        
      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: |
          echo "📦 Building workspace packages..."
          cd packages/mcp-client && pnpm build
          cd ../compare-engine && pnpm build

      - name: Setup code signing (macOS)
        if: ${{ secrets.CSC_LINK != '' }}
        run: |
          echo "🔐 Setting up macOS code signing..."
          # Import signing certificate
          echo "$CSC_LINK" | base64 --decode > certificate.p12
          security create-keychain -p "${{ secrets.CSC_KEY_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.CSC_KEY_PASSWORD }}" build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.CSC_KEY_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.CSC_KEY_PASSWORD }}" build.keychain
          rm certificate.p12
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}

      - name: Install app dependencies
        run: |
          echo "📦 Installing Mac app dependencies..."
          cd apps/desktop-mac
          pnpm install --no-frozen-lockfile
        env:
          CI: true

      - name: Build and sign mac app
        run: |
          echo "🍎 Building Mac desktop app..."
          cd apps/desktop-mac
          pnpm run build
          echo "📦 Packaging and signing Mac app..."
          pnpm run package
        env:
          CI: true
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: true

      - name: List build artifacts
        run: |
          echo "📋 Listing build artifacts..."
          ls -lh apps/desktop-mac/build/ || echo "Build directory not found"
          find apps/desktop-mac/build -type f \( -name "*.dmg" -o -name "*.zip" \) || echo "No DMG/ZIP files found"

      - name: Verify DMG files exist
        run: |
          echo "🔍 Verifying DMG files..."
          DMG_COUNT=$(find apps/desktop-mac/build -type f -name "*.dmg" | wc -l | tr -d ' ')
          if [ "$DMG_COUNT" -eq "0" ]; then
            echo "❌ Error: No DMG files found!"
            exit 1
          fi
          echo "✅ Found $DMG_COUNT DMG file(s):"
          find apps/desktop-mac/build -type f -name "*.dmg" -exec ls -lh {} \;

      - name: Upload mac artifacts to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: |
            apps/desktop-mac/build/**/*.dmg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
        
      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: |
          echo "📦 Building workspace packages..."
          cd packages/mcp-client && pnpm build
          cd ../compare-engine && pnpm build

      - name: Setup code signing (Windows)
        if: ${{ secrets.WIN_CSC_LINK != '' }}
        shell: bash
        run: |
          echo "🔐 Setting up Windows code signing..."
          # Decode and save certificate
          echo "$WIN_CSC_LINK" | base64 --decode > certificate.p12
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}

      - name: Install app dependencies
        run: |
          echo "📦 Installing Windows app dependencies..."
          cd apps/desktop-win
          pnpm install --no-frozen-lockfile
        env:
          CI: true

      - name: Build and sign windows app
        run: |
          echo "🪟 Building Windows desktop app..."
          cd apps/desktop-win
          pnpm run build
          echo "📦 Packaging and signing Windows app..."
          pnpm run package
        env:
          CI: true
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: true

      - name: Cleanup certificates
        if: always()
        shell: bash
        run: |
          # Clean up certificate files
          rm -f certificate.p12

      - name: List build artifacts
        shell: bash
        run: |
          echo "📋 Listing build artifacts..."
          if [ -d "apps/desktop-win/build" ]; then
            ls -lh apps/desktop-win/build/ || echo "Build directory exists but listing failed"
            find apps/desktop-win/build -type f \( -name "*.exe" -o -name "*.zip" \) || echo "No EXE/ZIP files found"
          else
            echo "Build directory not found"
          fi

      - name: Verify EXE files exist
        shell: bash
        run: |
          echo "🔍 Verifying EXE files..."
          EXE_COUNT=$(find apps/desktop-win/build -type f -name "*.exe" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$EXE_COUNT" -eq "0" ]; then
            echo "❌ Error: No EXE files found!"
            exit 1
          fi
          echo "✅ Found $EXE_COUNT EXE file(s):"
          find apps/desktop-win/build -type f -name "*.exe" -exec ls -lh {} \;

      - name: Upload windows artifacts to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: |
            apps/desktop-win/build/**/*.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [build-mac, build-win]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}

      - name: Display Release Summary
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          echo "## ✅ Release Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Uploaded Assets:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS DMG files (Apple Silicon & Intel)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Windows EXE installer" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Direct Download Links:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Mac (Apple Silicon): \`https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DesignQA-*-arm64.dmg\`" >> $GITHUB_STEP_SUMMARY
          echo "- Mac (Intel): \`https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DesignQA-*.dmg\`" >> $GITHUB_STEP_SUMMARY
          echo "- Windows: \`https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DesignQA*.exe\`" >> $GITHUB_STEP_SUMMARY
