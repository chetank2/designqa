name: Build Desktop Apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build (e.g., v2.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Debug - Show build info
        shell: bash
        run: |
          echo "🔍 Build Debug Info:"
          echo "Current branch/ref: $(git branch --show-current || echo 'detached HEAD')"
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Latest commit: $(git log -1 --oneline)"
          echo "Target tag: ${{ github.event.inputs.tag_name || 'v2.0.2' }}"
          echo "🔧 Checking if fixes are present:"
          if grep -q "prebuild-install" apps/desktop-mac/package.json 2>/dev/null; then
            echo "✅ prebuild-install fix is present in Mac"
          else
            echo "❌ prebuild-install fix is MISSING in Mac - this will cause build failures"
          fi
          if [ -f "apps/desktop-win/scripts/copy-frontend.js" ]; then
            echo "✅ copy-frontend.js script is present"
          else
            echo "❌ copy-frontend.js script is MISSING"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
        
      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: |
          echo "📦 Building workspace packages..."
          cd packages/mcp-client && pnpm build
          cd ../compare-engine && pnpm build

      - name: Setup code signing (macOS)
        if: env.CSC_LINK
        run: |
          echo "🔐 Setting up macOS code signing..."
          # Validate certificate is base64 encoded
          if echo "$CSC_LINK" | base64 --decode > /tmp/test.p12 2>/dev/null; then
            echo "✅ Valid certificate provided"
            # Import signing certificate
            echo "$CSC_LINK" | base64 --decode > certificate.p12
            security create-keychain -p "$CSC_KEY_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$CSC_KEY_PASSWORD" build.keychain
            security import certificate.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CSC_KEY_PASSWORD" build.keychain
            rm certificate.p12
            rm /tmp/test.p12
          else
            echo "❌ Invalid certificate format, skipping code signing"
            echo "CSC_LINK=" >> $GITHUB_ENV
          fi
      - name: Install app dependencies
        run: |
          echo "📦 Installing Mac app dependencies..."
          cd apps/desktop-mac
          pnpm install --no-frozen-lockfile
        env:
          CI: true

      - name: Build mac app
        run: |
          echo "🍎 Building Mac desktop app..."
          echo "🔎 Debug: CSC_LINK value = '$CSC_LINK'"
          cd apps/desktop-mac
          pnpm run build
          echo "📦 Packaging Mac app..."
          if [ -n "$CSC_LINK" ] && [ "$CSC_LINK" != "" ] && [[ "$CSC_LINK" =~ ^[A-Za-z0-9+/=]+$ ]]; then
            echo "🔐 Code signing enabled"
            pnpm run package
          else
            echo "⚠️ Code signing disabled (no certificate provided)"
            echo "📧 Unsetting all certificate environment variables"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            env -u CSC_LINK -u CSC_KEY_PASSWORD -u APPLE_ID -u APPLE_ID_PASSWORD pnpm run package
          fi
        env:
          CI: true

      - name: List build artifacts
        run: |
          echo "📋 Listing build artifacts..."
          ls -lh apps/desktop-mac/build/ || echo "Build directory not found"
          find apps/desktop-mac/build -type f \( -name "*.dmg" -o -name "*.zip" \) || echo "No DMG/ZIP files found"

      - name: Verify DMG files exist
        run: |
          echo "🔍 Verifying DMG files..."
          DMG_COUNT=$(find apps/desktop-mac/build -type f -name "*.dmg" | wc -l | tr -d ' ')
          if [ "$DMG_COUNT" -eq "0" ]; then
            echo "❌ Error: No DMG files found!"
            exit 1
          fi
          echo "✅ Found $DMG_COUNT DMG file(s):"
          find apps/desktop-mac/build -type f -name "*.dmg" -exec ls -lh {} \;

      - name: Upload mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: apps/desktop-mac/build/**/*.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Debug - Show build info
        shell: bash
        run: |
          echo "🔍 Build Debug Info:"
          echo "Current branch/ref: $(git branch --show-current || echo 'detached HEAD')"
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Latest commit: $(git log -1 --oneline)"
          echo "Target tag: ${{ github.event.inputs.tag_name || 'v2.0.2' }}"
          echo "🔧 Checking if fixes are present:"
          if grep -q "prebuild-install" apps/desktop-mac/package.json 2>/dev/null; then
            echo "✅ prebuild-install fix is present in Mac"
          else
            echo "❌ prebuild-install fix is MISSING in Mac - this will cause build failures"
          fi
          if [ -f "apps/desktop-win/scripts/copy-frontend.js" ]; then
            echo "✅ copy-frontend.js script is present"
          else
            echo "❌ copy-frontend.js script is MISSING"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
        
      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: |
          echo "📦 Building workspace packages..."
          cd packages/mcp-client && pnpm build
          cd ../compare-engine && pnpm build

      - name: Setup code signing (Windows)
        if: env.WIN_CSC_LINK
        shell: bash
        run: |
          echo "🔐 Setting up Windows code signing..."
          # Validate and decode certificate
          if echo "$WIN_CSC_LINK" | base64 --decode > /tmp/test.p12 2>/dev/null; then
            echo "✅ Valid certificate provided"
            echo "$WIN_CSC_LINK" | base64 --decode > certificate.p12
            rm /tmp/test.p12
          else
            echo "❌ Invalid certificate format, skipping code signing"
            echo "WIN_CSC_LINK=" >> $GITHUB_ENV
          fi

      - name: Install app dependencies
        run: |
          echo "📦 Installing Windows app dependencies..."
          cd apps/desktop-win
          pnpm install --no-frozen-lockfile
        env:
          CI: true

      - name: Build windows app
        shell: bash
        run: |
          echo "🪟 Building Windows desktop app..."
          cd apps/desktop-win
          pnpm run build
          echo "📦 Packaging Windows app..."
          if [ -n "$WIN_CSC_LINK" ]; then
            echo "🔐 Code signing enabled"
            pnpm run package
          else
            echo "⚠️ Code signing disabled (no certificate provided)"
            env -u WIN_CSC_LINK -u WIN_CSC_KEY_PASSWORD pnpm run package
          fi
        env:
          CI: true

      - name: Cleanup certificates
        if: always()
        shell: bash
        run: |
          # Clean up certificate files
          rm -f certificate.p12

      - name: List build artifacts
        shell: bash
        run: |
          echo "📋 Listing build artifacts..."
          if [ -d "apps/desktop-win/build" ]; then
            ls -lh apps/desktop-win/build/ || echo "Build directory exists but listing failed"
            find apps/desktop-win/build -type f \( -name "*.exe" -o -name "*.zip" \) || echo "No EXE/ZIP files found"
          else
            echo "Build directory not found"
          fi

      - name: Verify EXE files exist
        shell: bash
        run: |
          echo "🔍 Verifying EXE files..."
          EXE_COUNT=$(find apps/desktop-win/build -type f -name "*.exe" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$EXE_COUNT" -eq "0" ]; then
            echo "❌ Error: No EXE files found!"
            exit 1
          fi
          echo "✅ Found $EXE_COUNT EXE file(s):"
          find apps/desktop-win/build -type f -name "*.exe" -exec ls -lh {} \;

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: apps/desktop-win/build/**/*.exe
          if-no-files-found: error

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [build-mac, build-win]
    steps:
      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: release-assets/mac

      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-artifacts
          path: release-assets/win

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: |
            release-assets/mac/**/*.dmg
            release-assets/win/**/*.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [release]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Display Release Summary
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          echo "## ✅ Release Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Uploaded Assets:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS DMG files (Apple Silicon & Intel)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Windows EXE installer" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Direct Download Links:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Mac (Apple Silicon): \`https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DesignQA-*-arm64.dmg\`" >> $GITHUB_STEP_SUMMARY
          echo "- Mac (Intel): \`https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DesignQA-*.dmg\`" >> $GITHUB_STEP_SUMMARY
          echo "- Windows: \`https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DesignQA*.exe\`" >> $GITHUB_STEP_SUMMARY
