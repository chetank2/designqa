name: Auto-Update System

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build update for (e.g., v2.0.1)'
        required: true
        type: string

jobs:
  generate-update-manifest:
    name: Generate Update Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate update manifest
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          CLEAN_VERSION=${TAG_NAME#v}  # Remove 'v' prefix

          # Create update manifest JSON
          cat > update-manifest.json << EOF
          {
            "version": "$CLEAN_VERSION",
            "releaseDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-x64": {
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DesignQA-$CLEAN_VERSION.dmg",
                "signature": "",
                "size": 0
              },
              "darwin-arm64": {
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DesignQA-$CLEAN_VERSION-arm64.dmg",
                "signature": "",
                "size": 0
              },
              "win32-x64": {
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DesignQA Setup $CLEAN_VERSION.exe",
                "signature": "",
                "size": 0
              }
            },
            "releaseNotes": "https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME",
            "minimumSystemVersion": {
              "darwin": "10.15.0",
              "win32": "10.0.0"
            }
          }
          EOF

      - name: Upload update manifest to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: |
            update-manifest.json

  update-latest-release-info:
    name: Update Latest Release Info
    runs-on: ubuntu-latest
    needs: generate-update-manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create latest release info
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          CLEAN_VERSION=${TAG_NAME#v}

          # Create latest.json for auto-update checks
          cat > latest.json << EOF
          {
            "version": "$CLEAN_VERSION",
            "name": "$TAG_NAME",
            "notes": "https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-x64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DesignQA-$CLEAN_VERSION.dmg"
              },
              "darwin-arm64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DesignQA-$CLEAN_VERSION-arm64.dmg"
              },
              "win32-x64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/DesignQA Setup $CLEAN_VERSION.exe"
              }
            }
          }
          EOF

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: |
            latest.json

      # Optional: Deploy to CDN for faster update checks
      - name: Deploy to update server (Optional)
        run: |
          echo "📡 Deploying update files to CDN/server..."
          # Add commands to upload to your CDN or update server
          # Examples:
          # aws s3 cp latest.json s3://your-bucket/updates/
          # curl -X POST -H "Content-Type: application/json" -d @latest.json https://your-api.com/updates