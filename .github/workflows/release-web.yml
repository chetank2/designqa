name: Build and Deploy Web Apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build (e.g., v2.0.1)'
        required: true
        type: string
      deploy_environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: |
          echo "📦 Building workspace packages..."
          cd packages/mcp-client && pnpm build
          cd ../compare-engine && pnpm build

      - name: Build frontend
        run: |
          echo "🚀 Building frontend application..."
          cd apps/saas-frontend
          CI=true pnpm build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/saas-frontend/dist/
          retention-days: 30

      - name: Archive frontend for release
        if: github.event_name == 'release'
        run: |
          cd apps/saas-frontend
          tar -czf frontend-build-${{ github.event.release.tag_name || github.event.inputs.tag_name }}.tar.gz dist/

      - name: Upload frontend to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: |
            apps/saas-frontend/frontend-build-*.tar.gz

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: |
          echo "📦 Building workspace packages..."
          cd packages/mcp-client && pnpm build
          cd ../compare-engine && pnpm build

      - name: Build backend
        run: |
          echo "🔧 Building backend application..."
          cd apps/saas-backend
          CI=true pnpm build

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            apps/saas-backend/
            !apps/saas-backend/node_modules/
            !apps/saas-backend/output/
          retention-days: 30

      - name: Archive backend for release
        if: github.event_name == 'release'
        run: |
          tar --exclude=node_modules --exclude=output -czf backend-build-${{ github.event.release.tag_name || github.event.inputs.tag_name }}.tar.gz apps/saas-backend/

      - name: Upload backend to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: |
            backend-build-*.tar.gz

  # Optional: Deploy to cloud platforms
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: github.event.inputs.deploy_environment == 'staging' || (github.event_name == 'release' && contains(github.event.release.tag_name, 'rc'))
    environment: staging
    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-dist

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./backend-dist

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Frontend files:"
          ls -la ./frontend-dist/
          echo "Backend files:"
          ls -la ./backend-dist/
          # Add your deployment commands here
          # Examples:
          # - Deploy to Vercel, Netlify, AWS, etc.
          # - Upload to S3
          # - Deploy to your server via SSH

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: github.event.inputs.deploy_environment == 'production' || (github.event_name == 'release' && !contains(github.event.release.tag_name, 'rc'))
    environment: production
    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-dist

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./backend-dist

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Frontend files:"
          ls -la ./frontend-dist/
          echo "Backend files:"
          ls -la ./backend-dist/
          # Add your production deployment commands here

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: always()
    steps:
      - name: Display Build Summary
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          echo "## ✅ Web Apps Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Built Components:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Frontend (React + Vite)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend (Node.js + Express)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Workspace packages (MCP Client + Compare Engine)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "### 🔗 Download Links:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Frontend: \`https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/frontend-build-$TAG_NAME.tar.gz\`" >> $GITHUB_STEP_SUMMARY
            echo "- Backend: \`https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/backend-build-$TAG_NAME.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          fi